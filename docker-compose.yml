services:
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
      additional_contexts:
        monorepo: .
    command:
      - /bin/sh
      - -ec
      - |
        sed -i 's/\r$//' /workspace/start.sh
        exec /workspace/start.sh
    environment:
      BACKOFFICE_PORT: "${BACKOFFICE_PORT}"
      WEBSITE_PORT: "${WEBSITE_PORT}"
      API_PROXY_TARGET: "http://api:${API_PORT}"
      VITE_API_BASE_URL: ""
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: "/telemetry/events"
    ports:
      - "${BACKOFFICE_PORT}:${BACKOFFICE_PORT}"
      - "${WEBSITE_PORT}:${WEBSITE_PORT}"
    volumes:
      - ./uis/website:/workspace/uis/website
      - ./uis/backoffice:/workspace/uis/backoffice
      - ./packages/shared:/workspace/packages/shared
    networks:
      - brasaland-dev

  api:
    build:
      context: ./services
      dockerfile: Dockerfile
      additional_contexts:
        monorepo: .
    env_file:
      - .env
    environment:
      TELEMETRY_ENDPOINT: "http://127.0.0.1:${API_PORT}/telemetry/events"
    command:
      - sh
      - -c
      - uvicorn main:app --host 0.0.0.0 --port "$${API_PORT}" --reload
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./services/api:/app/services/api
    networks:
      - brasaland-dev

networks:
  brasaland-dev:
    name: brasaland-dev
    driver: bridge